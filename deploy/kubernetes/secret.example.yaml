apiVersion: v1
kind: Secret
metadata:
  name: easyinsights-secrets
  namespace: easyinsights
type: Opaque
stringData:
  MONGODB_URI: mongodb://REPLACE_WITH_MANAGED_REPLICA_SET/easyinsights?tls=true
  REDIS_URL: rediss://REPLACE_WITH_MANAGED_REDIS
  KAFKA_BROKERS: REPLACE_WITH_MANAGED_KAFKA:9092
  PASSWORD_PEPPER: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  WEBHOOK_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  CREDENTIAL_ENCRYPTION_KEY: REPLACE_WITH_BASE64_32_BYTE_KEY
