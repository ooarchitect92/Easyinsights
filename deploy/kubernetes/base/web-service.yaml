apiVersion: v1
kind: Service
metadata:
  name: easyinsights-web
  namespace: easyinsights
  labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: web }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http, protocol: TCP }]
