apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: easyinsights-web, namespace: easyinsights }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: easyinsights-web }
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleUp:
      {
        stabilizationWindowSeconds: 0,
        policies:
          [
            { type: Percent, value: 100, periodSeconds: 60 },
            { type: Pods, value: 4, periodSeconds: 60 },
          ],
        selectPolicy: Max,
      }
    scaleDown:
      {
        stabilizationWindowSeconds: 300,
        policies: [{ type: Percent, value: 25, periodSeconds: 60 }],
      }
  metrics:
    [
      {
        type: Resource,
        resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } },
      },
    ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: easyinsights-consumer, namespace: easyinsights }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: easyinsights-consumer }
  minReplicas: 3
  maxReplicas: 24
  behavior:
    scaleDown:
      {
        stabilizationWindowSeconds: 300,
        policies: [{ type: Percent, value: 25, periodSeconds: 60 }],
      }
  metrics:
    [
      {
        type: Resource,
        resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } },
      },
    ]
