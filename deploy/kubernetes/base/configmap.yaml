apiVersion: v1
kind: ConfigMap
metadata:
  name: easyinsights-config
  namespace: easyinsights
data:
  NODE_ENV: production
  APP_BASE_URL: https://marketing.example.com
  MONGODB_DB: easyinsights
  KAFKA_CLIENT_ID: easyinsights-production
  KAFKA_GROUP_ID: easyinsights-production-consumer
  SESSION_COOKIE_NAME: ei_session
  SESSION_TTL_SECONDS: '28800'
  RAW_EVENT_TTL_DAYS: '90'
  IDEMPOTENCY_TTL_HOURS: '24'
  OUTBOX_TTL_DAYS: '14'
  RUN_TTL_DAYS: '90'
  LIVE_ACTIVATION_ENABLED: 'false'
  HEALTH_PORT: '8081'
