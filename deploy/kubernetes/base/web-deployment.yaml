apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyinsights-web
  namespace: easyinsights
  labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    { matchLabels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: web } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: easyinsights
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: easyinsights-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000, protocol: TCP }]
          envFrom:
            - configMapRef: { name: easyinsights-config }
            - secretRef: { name: easyinsights-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: ['ALL'] }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: '1', memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
