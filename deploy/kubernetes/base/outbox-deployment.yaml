apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyinsights-outbox
  namespace: easyinsights
  labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: outbox }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    { matchLabels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: outbox } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: outbox }
    spec:
      serviceAccountName: easyinsights
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: outbox
          image: easyinsights-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: WORKER_MODE, value: outbox }
          envFrom:
            - configMapRef: { name: easyinsights-config }
            - secretRef: { name: easyinsights-secrets }
          ports: [{ name: health, containerPort: 8081, protocol: TCP }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: ['ALL'] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 768Mi }
          startupProbe:
            httpGet: { path: /health/live, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: health }
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
