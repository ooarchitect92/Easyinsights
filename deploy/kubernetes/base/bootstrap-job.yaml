apiVersion: batch/v1
kind: Job
metadata:
  name: easyinsights-bootstrap
  namespace: easyinsights
  labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: bootstrap }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: bootstrap }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: easyinsights
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: easyinsights-tooling:latest
          command: ['sh', '-c', 'npm run indexes && npm run topics']
          envFrom:
            - configMapRef: { name: easyinsights-config }
            - secretRef: { name: easyinsights-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: ['ALL'] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
