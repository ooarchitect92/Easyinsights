apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: easyinsights }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-web-ingress, namespace: easyinsights }
spec:
  podSelector:
    { matchLabels: { app.kubernetes.io/name: easyinsights, app.kubernetes.io/component: web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ protocol: TCP, port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-observability-ingress, namespace: easyinsights }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: easyinsights } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ protocol: TCP, port: 8081 }, { protocol: TCP, port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-required-egress, namespace: easyinsights }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: easyinsights } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - ports:
        [
          { protocol: TCP, port: 27017 },
          { protocol: TCP, port: 6379 },
          { protocol: TCP, port: 9092 },
          { protocol: TCP, port: 443 },
        ]
