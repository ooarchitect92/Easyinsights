name: Snapshot and diagnose current branch

on:
  push:
    branches:
      - codex/easyinsights-production-20260901

permissions:
  contents: read

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean checkout paths
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Tracked generated artifacts:"
          git ls-files | grep -E '(^|/)(\.next|dist|node_modules)/|tsbuildinfo$' || true
          echo "Tracked web route files:"
          git ls-files 'apps/web/src/app/**' | sort
          echo "Unexpected diagnostic paths:"
          find . -type f \( -path '*\(auth\)*' -o -path '*customerId*' -o -path '*reports/custom*' -o -path '*packages/ui*' \) -print || true

      - name: Package exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/easyinsights-current-source.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: easyinsights-current-source
          path: /tmp/easyinsights-current-source.tar.gz
          retention-days: 3

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Run clean web typecheck diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf apps/web/.next apps/web/tsconfig.tsbuildinfo
          find apps/web -name '*.tsbuildinfo' -delete
          npm run build:packages
          npm run typecheck -w @easyinsights/web 2>&1 | tee /tmp/web-typecheck.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easyinsights-web-typecheck-log
          path: /tmp/web-typecheck.log
          if-no-files-found: ignore
          retention-days: 3
