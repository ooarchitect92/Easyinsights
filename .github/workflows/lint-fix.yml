name: Apply targeted type fixes

on:
  push:
    branches:
      - codex/easyinsights-production-20260901

permissions:
  contents: write

jobs:
  repair-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Apply strict TypeScript corrections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          cache_path = Path('packages/core/src/cache.ts')
          cache = cache_path.read_text()
          cache = cache.replace("import Redis from 'ioredis';", "import { Redis } from 'ioredis';", 1)
          cache = cache.replace('retryStrategy: (times) =>', 'retryStrategy: (times: number) =>', 1)
          cache_path.write_text(cache)

          platform_path = Path('packages/core/src/platform.ts')
          platform = platform_path.read_text()
          old_find = ".find(tenantFilter(input.scope), { session: input.session })"
          new_find = ".find(\n      tenantFilter(input.scope),\n      input.session ? { session: input.session } : undefined,\n    )"
          if old_find not in platform:
              raise SystemExit('Expected audit find options were not found')
          platform = platform.replace(old_find, new_find, 1)
          old_insert = "    { session: input.session },\n  );"
          new_insert = "    input.session ? { session: input.session } : undefined,\n  );"
          if old_insert not in platform:
              raise SystemExit('Expected audit insert options were not found')
          platform_path.write_text(platform.replace(old_insert, new_insert, 1))

          queue_path = Path('packages/core/src/queue.ts')
          queue = queue_path.read_text()
          old_queue = "insertOne(doc, { session });"
          if old_queue not in queue:
              raise SystemExit('Expected outbox insert options were not found')
          queue_path.write_text(queue.replace(old_queue, "insertOne(doc, session ? { session } : undefined);", 1))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['typecheck'] = (
              'npm run build:packages && '
              'npm run typecheck -w @easyinsights/web && '
              'npm run typecheck -w @easyinsights/worker'
          )
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Format affected files
        run: npx prettier --write package.json packages/core/src/cache.ts packages/core/src/platform.ts packages/core/src/queue.ts

      - run: npm run lint

      - name: Commit strict TypeScript corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/core/src/cache.ts packages/core/src/platform.ts packages/core/src/queue.ts
          git commit -m "fix: satisfy strict TypeScript contracts in core runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
