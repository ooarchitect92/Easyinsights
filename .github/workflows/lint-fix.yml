name: Temporary canonical formatter

on:
  push:
    branches:
      - codex/easyinsights-production-20260901

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Apply repository formatting
        run: npx prettier --write apps/worker/src/handlers/canonical.ts

      - name: Commit formatted handler
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Canonical handler already matches Prettier."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/handlers/canonical.ts
          git commit -m "style: apply canonical handler formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
