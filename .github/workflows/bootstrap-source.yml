name: Bootstrap EasyInsights source

on:
  push:
    branches:
      - codex/easyinsights-production-20260901

permissions:
  contents: write

jobs:
  unpack-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Expand production source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.* > /tmp/easyinsights-source.tar.xz.b64
          base64 --decode /tmp/easyinsights-source.tar.xz.b64 > /tmp/easyinsights-source.tar.xz
          echo "156c6476935ce3033b7fa85f4fa71369a349ba6717235c51fc29ad44298b20ad  /tmp/easyinsights-source.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/easyinsights-source
          mkdir -p /tmp/easyinsights-source
          tar -xJf /tmp/easyinsights-source.tar.xz -C /tmp/easyinsights-source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/easyinsights-source/Easyinsights/ ./

      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Format repository
        run: npm run format

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: implement production EasyInsights marketing intelligence platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate repository
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production artifacts
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config > /tmp/easyinsights-compose.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Validate Kubernetes manifests
        run: kubectl kustomize deploy/kubernetes/overlays/production > /tmp/easyinsights-kubernetes.yaml
