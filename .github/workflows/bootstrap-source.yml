name: Bootstrap EasyInsights source

on:
  push:
    branches:
      - codex/easyinsights-production-20260901

permissions:
  contents: write

jobs:
  unpack-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Expand production source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.* > /tmp/easyinsights-source.tar.xz.b64
          base64 --decode /tmp/easyinsights-source.tar.xz.b64 > /tmp/easyinsights-source.tar.xz
          echo "156c6476935ce3033b7fa85f4fa71369a349ba6717235c51fc29ad44298b20ad  /tmp/easyinsights-source.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/easyinsights-source
          mkdir -p /tmp/easyinsights-source
          tar -xJf /tmp/easyinsights-source.tar.xz -C /tmp/easyinsights-source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/easyinsights-source/Easyinsights/ ./

      - name: Repair source syntax identified by the first parser gate
        shell: bash
        run: |
          cat > apps/web/src/components/capability-page.tsx <<'EOF'
          import type { ReactNode } from 'react';

          export interface Metric {
            label: string;
            value: string | number;
            detail?: string;
          }

          export interface Column {
            key: string;
            label: string;
            render?: (row: Record<string, unknown>) => ReactNode;
          }

          interface CapabilityPageProps {
            eyebrow?: string;
            title: string;
            description: string;
            metrics?: Metric[];
            columns?: Column[];
            rows?: Record<string, unknown>[];
            actions?: ReactNode;
            notice?: ReactNode;
            children?: ReactNode;
          }

          export function CapabilityPage({
            eyebrow,
            title,
            description,
            metrics = [],
            columns = [],
            rows = [],
            actions,
            notice,
            children,
          }: CapabilityPageProps) {
            return (
              <div className="page-stack">
                <header className="page-header">
                  <div>
                    {eyebrow ? <span className="eyebrow">{eyebrow}</span> : null}
                    <h1>{title}</h1>
                    <p>{description}</p>
                  </div>
                  {actions ? <div className="header-actions">{actions}</div> : null}
                </header>

                {notice ? <div className="notice">{notice}</div> : null}

                {metrics.length > 0 ? (
                  <section className="metrics-grid">
                    {metrics.map((metric) => (
                      <article className="metric-card" key={metric.label}>
                        <span>{metric.label}</span>
                        <strong>{metric.value}</strong>
                        {metric.detail ? <small>{metric.detail}</small> : null}
                      </article>
                    ))}
                  </section>
                ) : null}

                {children}

                {columns.length > 0 ? (
                  <section className="table-card">
                    <div className="table-scroll">
                      <table>
                        <thead>
                          <tr>
                            {columns.map((column) => (
                              <th key={column.key}>{column.label}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {rows.length > 0 ? (
                            rows.map((row, index) => (
                              <tr key={String(row.id ?? index)}>
                                {columns.map((column) => (
                                  <td key={column.key}>
                                    {column.render
                                      ? column.render(row)
                                      : String(row[column.key] ?? '—')}
                                  </td>
                                ))}
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan={columns.length}>
                                <div className="empty-state">
                                  <strong>No records yet</strong>
                                  <span>
                                    Connect a source, ingest events, or use the development seed to
                                    populate this view.
                                  </span>
                                </div>
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </section>
                ) : null}
              </div>
            );
          }

          export function StatusBadge({ value }: { value: unknown }) {
            const text = String(value ?? 'unknown').replaceAll('_', ' ');
            const kind = ['healthy', 'active', 'completed', 'published', 'approved', 'success'].includes(
              String(value),
            )
              ? 'good'
              : ['failed', 'critical', 'rejected', 'blocked'].includes(String(value))
                ? 'bad'
                : ['pending', 'warning', 'degraded', 'queued', 'processing'].includes(String(value))
                  ? 'warn'
                  : 'neutral';

            return <span className={`status ${kind}`}>{text}</span>;
          }
          EOF

      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Format repository
        run: npm run format

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: implement production EasyInsights marketing intelligence platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate repository
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production artifacts
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config > /tmp/easyinsights-compose.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Validate Kubernetes manifests
        run: kubectl kustomize deploy/kubernetes/overlays/production > /tmp/easyinsights-kubernetes.yaml
