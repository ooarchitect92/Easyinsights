[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easyinsights-ml-service"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.117.1","pydantic==2.11.9","uvicorn==0.37.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1","pytest==8.4.2","ruff==0.13.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
